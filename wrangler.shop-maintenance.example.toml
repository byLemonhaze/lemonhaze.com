# Template only. Replace the database ID before deployment. Use the same private
# SHOP_DB as Pages. Install STRIPE_SECRET_KEY with `wrangler secret put`.
name = "lemonhaze-shop-maintenance"
main = "workers/shop-maintenance.js"
compatibility_date = "2026-10-28"
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/10 * * * *"]

[vars]
SHOP_MODE = "test"

[[d1_databases]]
binding = "SHOP_DB"
database_name = "lemonhaze-shop"
database_id = "REPLACE_WITH_SHOP_DATABASE_ID"
migrations_dir = "db/shop-migrations"
