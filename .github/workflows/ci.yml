name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Keep the runner compatible with the locked Playwright browser dependencies.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium for prerendering
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: npm run verify
